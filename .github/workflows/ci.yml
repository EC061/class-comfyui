name: ci
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No `version:` key: the action reads the exact version from the
        # `packageManager` field in package.json. Specifying both errors out
        # with "Multiple versions of pnpm specified".
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @class-comfyui/web build
      - run: pnpm --filter @class-comfyui/gateway build
