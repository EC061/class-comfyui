# Host-based routing. Plain HTTP only — TLS terminates at FRPS, forwarded via FRPC.
# comfy-admin.example.edu -> web:3000 ; comfy.example.edu -> gateway:8081
# WebSocket Upgrade properly proxied for /ws.

upstream web {
  server web:3000;
}
upstream comfy_gateway {
  server gateway:8081;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name comfy-admin.example.edu;

  # Trust only internal FRPC/nginx path; PUBLIC_URL remains authoritative in app.
  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name comfy.example.edu;

  client_max_body_size 100m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location / {
    proxy_pass http://comfy_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
