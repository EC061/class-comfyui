# Production deployment — prebuilt GHCR image, plain HTTP internally.
# TLS terminates at FRPS; FRPC forwards to 127.0.0.1:8080 -> nginx.
# All application configuration is declared here in `environment:` blocks.
# DO NOT commit real secrets. For production, keep a private copy of this file
# or inject the same named fields via Docker secrets / env injection.
#
# Local dev origin mode:
#   PUBLIC_URL: "http://localhost:8080"
#   COMFY_PUBLIC_URL: "http://comfy.localhost:8080"

name: class-comfyui

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Only nginx exposes a host port. Postgres/Redis/workers are internal only.
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - gateway

  web:
    # CHANGE_ME: replace OWNER/REPO with your GHCR path, e.g. ghcr.io/myorg/class-comfyui:latest
    image: ghcr.io/OWNER/REPO:latest
    command: ["web"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: "production"
      # MUST_CHANGE: canonical externally visible URL of the Next.js app (exactly one).
      PUBLIC_URL: "https://comfy-admin.example.edu"
      # MUST_CHANGE if used: canonical ComfyUI gateway URL (separate security boundary).
      COMFY_PUBLIC_URL: "https://comfy.example.edu"
      PORT: "3000"
      # MUST_CHANGE: postgres password portion must match postgres service below.
      DATABASE_URL: "postgresql://comfy:CHANGE_ME@postgres:5432/comfy"
      REDIS_URL: "redis://redis:6379"
      # MUST_CHANGE: long random secrets (>=32 chars). Generate with: openssl rand -base64 48
      AUTH_SECRET: "CHANGE_ME"
      WORKSPACE_JWT_SECRET: "CHANGE_ME"
      # MUST_CHANGE: secret admin registration code (never logged/stored, never client-side).
      ADMIN_REGISTRATION_CODE: "CHANGE_ME"
      # SMTP (passwordless email). MUST_CHANGE host/credentials for production.
      SMTP_HOST: "smtp.example.edu"
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: "CHANGE_ME"
      SMTP_SECURE: "false"
      SMTP_FROM_NAME: "ComfyUI Lab"
      SMTP_FROM_EMAIL: "noreply@example.edu"
      # Audit archival
      AUDIT_DATA_DIR: "/data/audit"
      AUDIT_RETENTION_ENABLED: "false"
      AUDIT_RETENTION_DAYS: "180"
      # Queue fairness
      MAX_ACTIVE_JOBS_PER_USER: "1"
      MAX_QUEUED_JOBS_PER_USER: "3"
    volumes:
      - audit-data:/data/audit

  gateway:
    image: ghcr.io/OWNER/REPO:latest
    command: ["gateway"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: "production"
      PUBLIC_URL: "https://comfy-admin.example.edu"
      COMFY_PUBLIC_URL: "https://comfy.example.edu"
      GATEWAY_PORT: "8081"
      DATABASE_URL: "postgresql://comfy:CHANGE_ME@postgres:5432/comfy"
      REDIS_URL: "redis://redis:6379"
      # MUST_CHANGE: must equal web WORKSPACE_JWT_SECRET
      WORKSPACE_JWT_SECRET: "CHANGE_ME"
      AUDIT_DATA_DIR: "/data/audit"
      MAX_ACTIVE_JOBS_PER_USER: "1"
      MAX_QUEUED_JOBS_PER_USER: "3"
    volumes:
      - audit-data:/data/audit

  migrate:
    image: ghcr.io/OWNER/REPO:latest
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://comfy:CHANGE_ME@postgres:5432/comfy"

  postgres:
    image: postgres:17
    restart: unless-stopped
    # No host ports exposed by default (internal only).
    environment:
      POSTGRES_USER: "comfy"
      # MUST_CHANGE: strong postgres password; must match DATABASE_URL above.
      POSTGRES_PASSWORD: "CHANGE_ME"
      POSTGRES_DB: "comfy"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfy -d comfy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    # No host ports exposed by default (internal only).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional dev-only mail catcher. Enable with: docker compose --profile dev up
  mailpit:
    image: axllent/mailpit
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  audit-data:
