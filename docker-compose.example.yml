# EXAMPLE deployment configuration. Do not edit this file in place for production.
# Copy it once and edit the copy — the real file is git-ignored, so `git pull`
# never overwrites the deployed node's configuration:
#   cp docker-compose.example.yml docker-compose.yml
# No .env file is required.
# All three application containers share a LOCAL filesystem on this one host.
# Do not put ./data on NFS, SMB, or a distributed filesystem. Back up with `backup`.
name: class-comfyui
services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      # MUST CHANGE these to the hostname portions of the two canonical URLs.
      PUBLIC_HOST: "comfy-admin.example.edu"
      COMFY_HOST: "comfy.example.edu"
      NGINX_ENVSUBST_FILTER: "PUBLIC_HOST|COMFY_HOST"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null --header="Host: $$PUBLIC_HOST" http://127.0.0.1/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    # MUST CHANGE to your lowercase GHCR repository path and a published tag.
    image: &app-image ghcr.io/owner/class-comfyui:latest
    command: ["web"]
    restart: unless-stopped
    init: true
    environment: &app-environment
      NODE_ENV: "production"
      # MUST CHANGE: exact, separate browser origins. HTTP is supported for local testing.
      PUBLIC_URL: "https://comfy-admin.example.edu"
      COMFY_PUBLIC_URL: "https://comfy.example.edu"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      GATEWAY_PORT: "8081"
      SQLITE_PATH: "/data/lab.sqlite"
      AUDIT_DATA_DIR: "/data/audit"
      UPLOAD_DATA_DIR: "/data/uploads"
      # MUST CHANGE: generate THREE independent values with `openssl rand -hex 32`.
      AUTH_SECRET: "CHANGE_ME"
      WORKSPACE_JWT_SECRET: "CHANGE_ME"
      ADMIN_REGISTRATION_CODE: "CHANGE_ME"
      # MUST CHANGE SMTP connection and sender; failures never log sign-in tokens.
      SMTP_HOST: "smtp.example.edu"
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: "CHANGE_ME"
      SMTP_SECURE: "false"
      SMTP_FROM_NAME: "ComfyUI Lab"
      SMTP_FROM_EMAIL: "noreply@example.edu"
      SESSION_TTL_HOURS: "168"
      VERIFICATION_TTL_MINUTES: "15"
      WORKSPACE_TOKEN_TTL_SECONDS: "60"
      MAX_ACTIVE_JOBS_PER_USER: "1"
      MAX_QUEUED_JOBS_PER_USER: "3"
      JOB_TIMEOUT_SECONDS: "7200"
      WORKER_REQUEST_TIMEOUT_MS: "30000"
      MAX_UPLOAD_MB: "100"
      MAX_USER_STORAGE_MB: "2048"
      MAX_ARCHIVE_MB: "20480"
      AUDIT_RETENTION_ENABLED: "false"
      AUDIT_RETENTION_DAYS: "180"
      # Explicit vetted node classes. Only extend after reviewing filesystem/network
      # behavior. A gateway cannot sandbox arbitrary Python custom nodes.
      COMFY_ALLOWED_NODES: "CheckpointLoaderSimple,CLIPTextEncode,CLIPSetLastLayer,EmptyLatentImage,KSampler,KSamplerAdvanced,VAEDecode,VAEEncode,VAELoader,SaveImage,PreviewImage,LoadImage,ImageScale,ImageScaleBy,ImageInvert,ImageBatch,ImagePadForOutpaint,LatentUpscale,LatentUpscaleBy,LatentComposite,LatentBlend,RepeatLatentBatch,LoraLoader,LoraLoaderModelOnly,ConditioningCombine,ConditioningConcat,ConditioningAverage,ConditioningSetArea,ConditioningSetMask,ControlNetLoader,ControlNetApply,ControlNetApplyAdvanced,CLIPVisionLoader,CLIPVisionEncode,UNETLoader,DualCLIPLoader,CLIPLoader,FluxGuidance,ModelSamplingFlux,EmptySD3LatentImage,SaveAnimatedWEBP"
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: *app-image
    command: ["gateway"]
    restart: unless-stopped
    init: true
    # Same named configuration and same database as web; no independent identity store.
    environment:
      <<: *app-environment
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt: ["no-new-privileges:true"]

  migrate:
    image: *app-image
    command: ["migrate"]
    environment:
      NODE_ENV: "production"
      SQLITE_PATH: "/data/lab.sqlite"
    volumes:
      - ./data:/data
    security_opt: ["no-new-privileges:true"]
